<!DOCTYPE html>
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>POR Prerelease manager</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>
    <h1>POR Prerelease Manager:</h1>
    <hr>
    <div id="container">
    <ul>
        <li>Mats</li>
        <li>Bela</li>
        <li>Ben</li>
        <li>Tun</li>
        <li>Aidan</li>
        <li>Pierkachu & Tim</li>
    </ul>
    <hr>
    </div>
    <div id="UI">
        <h2 id ="message"></h2>
        <h4 id ="second"></h4>
        <h4 id ="third"></h4>
        <p id ="4."></p>
        <p id ="5."></p>
        <p id ="6."></p>
    </div>
    <button id="start">Start</button>
    <div id="table">
        <table>
            <tr>
                <th>Ready Player 1</th>
                <th>Ready Player 2</th>
            </tr>
            <tr>
                <td><button id="b1" >player 1</button></td>
                <td><button id="b2">player 2</button></td>
            </tr>
            <tr>
                <td><button id="b3">player 3</button></td>
                <td><button id="b4">player 4</button></td>
            </tr>
            <tr>
                <td><button id="b5">player 5</button></td>
                <td><button id="b6">player 6</button></td>
            </tr>
        </table>
    </div>
    <button id="next">Next round</button>

</body>
